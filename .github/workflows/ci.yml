name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -m "not slow"            # unit tests + camera round-trip + fast scenarios (python detector, no C++)
      - run: python -m pytest -m slow                  # transport parity over a real pty (~40 s real-time)
 
