name: alt_bias_drift
description: Altitude reads 0.15 m high and drifts up at 1 cm/s. Must still detect touchdown correctly.
seed: 0
duration_s: 120
initial: {pos: [0.5, -0.3, 3.0]}
environment:
  alt_sensor: {bias_m: 0.15, drift_ms: 0.01}
pass: {touchdown_err_max_m: 0.15, terminal_state: DISARM, no_safety_trip: true, no_fc_failsafe: true}
