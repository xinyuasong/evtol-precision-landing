name: nominal_calm
description: Baseline. Calm air, clean sensors, start 3 m up and offset from the pad.
seed: 0
duration_s: 90
initial: {pos: [0.5, -0.3, 3.0]}
environment:
  wind: {steady_ms: [0.0, 0.0], gust_sigma_ms: 0.0}
  alt_sensor: {noise_m: 0.01, vario_noise_ms: 0.03}
  camera: {fps: 30, latency_s: 0.04, noise_sigma: 4.0}
pass:
  touchdown_err_max_m: 0.10
  terminal_state: DISARM
  no_safety_trip: true
  no_fc_failsafe: true
  touchdown_vz_max_ms: 0.6
