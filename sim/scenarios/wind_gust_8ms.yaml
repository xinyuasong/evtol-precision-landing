name: wind_gust_8ms
description: 3 m/s mean with gusts to ~8 m/s. Disturbance rejection without an envelope trip.
seed: 0
duration_s: 120
initial: {pos: [0.5, -0.3, 3.0]}
environment:
  wind: {steady_ms: [2.0, 2.0], gust_sigma_ms: 2.5, gust_tau_s: 1.5}
vehicle_config_overrides:
  # 8 m/s gusts are ~1.6 m/s^2 on this airframe; 5 deg of lean cannot reach that. The operator raises
  # the clip to 12.5 deg and lets the PIDs saturate later (out_limit 2.5 = 12.5 deg). Loop gain is unchanged.
  guidance:
    authority: 0.50
    x: {kp: 1.00, ki: 0.30, kd: 1.60, i_limit: 2.5, out_limit: 2.5, d_tau_s: 0.08}
    y: {kp: 1.00, ki: 0.30, kd: 1.60, i_limit: 2.5, out_limit: 2.5, d_tau_s: 0.08}
pass: {touchdown_err_max_m: 0.25, terminal_state: DISARM, no_safety_trip: true, no_fc_failsafe: true}
